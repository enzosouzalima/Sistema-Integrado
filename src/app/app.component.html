<div class="main">
  <header>
    <h1>Nome: Enzo de Souza Lima RA:156503</h1>
  </header>

  <input
    class="lg-text-input"
    #campoNovoItem
    (keyup.enter)="CREATE_tarefa(campoNovoItem.value); campoNovoItem.value = ''"
  />

  <button
    class="btn-primary"
    (click)="CREATE_tarefa(campoNovoItem.value); campoNovoItem.value = ''">
    Adicionar Tarefa
  </button>

  <ul>
    <li *ngFor="let tarefaDoLoop of arrayDeTarefas()">
      <app-item
        [tarefa]="tarefaDoLoop"
        (removeTarefa)="DELETE_tarefa(tarefaDoLoop)"
        (modificaTarefa)="UPDATE_tarefa(tarefaDoLoop)">
      </app-item>
    </li>
  </ul>
</div>
